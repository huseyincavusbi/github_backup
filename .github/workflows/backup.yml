name: GitHub Backup to Drive

on:
  push:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:  # Manual trigger

jobs:
  backup:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Display system and runner geolocation information
        run: |
          echo "=== OS Information ==="
          uname -a
          echo ""
          echo "=== CPU Information ==="
          nproc
          echo "CPU Details:"
          lscpu | head -10
          echo ""
          echo "=== Runner Network & Geolocation ==="
          curl -s https://ipinfo.io/json || curl -s https://ifconfig.me/all

      - name: Setup uv and Python 3.13
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq rclone git zip

      - name: Install Python dependencies with uv
        run: |
          uv sync --frozen

      - name: Run backup engine
        env:
          GITHUB_TOKEN:   ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          GITLAB_TOKEN:   ${{ secrets.GITLAB_TOKEN }}
          GITLAB_USER:    ${{ secrets.GITLAB_USER }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CODEBERG_USER:  ${{ secrets.CODEBERG_USER }}
        run: |
          uv run python backup_engine.py

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" > ~/.config/rclone/rclone.conf

      - name: Archive to ZIP and upload to Google Drive with snapshot retention
        run: |
          # Number of dated backup archives to keep on Drive.
          KEEP_BACKUPS=7

          LATEST_BACKUP=$(ls -td backups/backup_* 2>/dev/null | grep -v '\.zip$' | head -1)
          if [ -z "$LATEST_BACKUP" ]; then
            echo "No backup directory found to upload"
            exit 0
          fi

          BACKUP_NAME=$(basename "$LATEST_BACKUP")   # e.g. backup_2026-08-24
          echo "Compressing $BACKUP_NAME into ZIP archive on runner disk..."

          cd backups
          zip -r -q "temp_${BACKUP_NAME}.zip" "$BACKUP_NAME"

          # Calculate exact file size in KB
          SIZE_BYTES=$(stat -c%s "temp_${BACKUP_NAME}.zip" 2>/dev/null || stat -f%z "temp_${BACKUP_NAME}.zip")
          SIZE_KB=$(( (SIZE_BYTES + 1023) / 1024 ))
          ZIP_NAME="${BACKUP_NAME}__${SIZE_KB}KB.zip"
          mv "temp_${BACKUP_NAME}.zip" "$ZIP_NAME"

          echo "Archive created: $ZIP_NAME (${SIZE_KB} KB)"
          echo "Uploading $ZIP_NAME → gdrivegit:GitHub_Backups/"
          rclone copy "$ZIP_NAME" "gdrivegit:GitHub_Backups/" --progress

          # --- Prune old ZIP archives beyond retention window ---
          echo "Pruning old Drive backup archives (keeping last $KEEP_BACKUPS)..."
          ALL_BACKUPS=$(rclone lsf gdrivegit:GitHub_Backups/ \
            | grep '^backup_.*\.zip$' \
            | sort -r)

          COUNT=0
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              COUNT=$((COUNT + 1))
              if [ "$COUNT" -gt "$KEEP_BACKUPS" ]; then
                echo "  Deleting old backup archive: $file"
                rclone deletefile "gdrivegit:GitHub_Backups/${file}" --drive-use-trash=false
              fi
            fi
          done <<< "$ALL_BACKUPS"

          echo "Drive upload and pruning complete."
